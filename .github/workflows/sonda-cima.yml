name: Sonda CIMA (diagnóstico)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda-cima.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Cabeceras CORS de la API de CIMA
        run: |
          for u in "https://cima.aemps.es/cima/rest/medicamentos?nombre=mepolizumab" "https://cima.aemps.es/cima/rest/presentaciones?nregistro=1151043001"; do
            echo "=== GET $u"; curl -sS -D - -o /dev/null -H "Origin: https://ramonmorillo.es" "$u" | grep -iE "^HTTP|access-control|content-type" || true
            echo "=== OPTIONS $u"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://ramonmorillo.es" -H "Access-Control-Request-Method: GET" "$u" | grep -iE "^HTTP|access-control" || true
          done
      - name: Forma de los datos
        run: |
          B=https://cima.aemps.es/cima/rest
          for q in "nombre=nucala" "practiv1=mepolizumab" "nombre=biktarvy" "nombre=dovato" "practiv1=metotrexato"; do
            curl -sS "$B/medicamentos?$q" | python3 -c "import json,sys;d=json.load(sys.stdin);print('Q',sys.argv[1],'total',d.get('totalFilas'));[print('  ',x['nregistro'],'|',x['nombre'],'|',x.get('pactivos'),'| comerc',x.get('comerc'),'| cpresc',x.get('cpresc')) for x in d['resultados'][:6]]" "$q"
          done
          N=$(curl -sS "$B/medicamentos?nombre=biktarvy" | python3 -c "import json,sys;print(json.load(sys.stdin)['resultados'][0]['nregistro'])")
          curl -sS "$B/medicamento?nregistro=$N" | python3 -c "import json,sys;d=json.load(sys.stdin);print('CLAVES',sorted(d.keys()));print('PRES',json.dumps(d.get('presentaciones'),ensure_ascii=False)[:900]);print('FF',json.dumps(d.get('formaFarmaceutica'),ensure_ascii=False));print('VIAS',json.dumps(d.get('viasAdministracion'),ensure_ascii=False));print('PA',json.dumps(d.get('principiosActivos'),ensure_ascii=False)[:400]);print('ATC',json.dumps(d.get('atcs'),ensure_ascii=False)[:300]);print('cpresc',d.get('cpresc'),'dosis',d.get('dosis'))"
          curl -sS "$B/presentaciones?nregistro=$N" | python3 -c "import json,sys;d=json.load(sys.stdin);print('PRESENTACIONES',json.dumps(d,ensure_ascii=False)[:900])"
